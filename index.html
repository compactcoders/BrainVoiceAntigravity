<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainVoice AI | Coming Soon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a0a, #111827, #1e293b);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 700px;
    }

    .logo {
      font-size: 1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    p {
      font-size: 1.15rem;
      color: #d1d5db;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .tag {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      font-size: 0.95rem;
      color: #e5e7eb;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.2rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">BrainVoice AI</div>
    <h1>Something Powerful Is Coming Soon</h1>
    <p>
      We’re currently building a smarter digital experience for BrainVoice AI.
      Our new website is under development and will be launching soon.
    </p>
    <div class="tag">Website Under Construction</div>
  </div>
</body>
</html>
